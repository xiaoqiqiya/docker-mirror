name: 精简-内网-镜像 action

on:
  workflow_dispatch:
    inputs:
      IMAGE_NAME:
        description: '原镜像地址(可带版本,如 mysql/mysql-server:8.0)'
        required: true
        default: 'mysql/mysql-server:latest'
      INTERNAL_REGISTRY:
        description: '内网 HTTP 仓库地址(主机名:端口，不带 http://，如 registry.internal:5000)'
        required: true
        default: 'crpi-0k5b7uxogmjxo5px-vpc.cn-shanghai.personal.cr.aliyuncs.com:9001'
      EXTERNAL_REGISTRY:
        description: '外网仓库地址(主机名，可带端口，如 registry.example.com:5000)'
        required: true
        default: 'crpi-0k5b7uxogmjxo5px.cn-shanghai.personal.cr.aliyuncs.com'
      TARGET_REPOSITORY:
        description: '空间名称'
        required: true
        default: 'mirror-transfer'
      USE_SUMMARY_REPOSITORY:
        description: '是否使用汇总仓库'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate registry inputs
        env:
          INTERNAL_REGISTRY: ${{ github.event.inputs.INTERNAL_REGISTRY }}
          EXTERNAL_REGISTRY: ${{ github.event.inputs.EXTERNAL_REGISTRY }}
          REGISTRY_HOST_IP: ${{ secrets.REGISTRY_HOST_IP }}
        run: |
          set -euo pipefail

          if [[ -z "$REGISTRY_HOST_IP" ]]; then
            echo "::error::Secret REGISTRY_HOST_IP 不能为空"
            exit 1
          fi
          echo "::add-mask::$REGISTRY_HOST_IP"

          if [[ -z "$INTERNAL_REGISTRY" || -z "$EXTERNAL_REGISTRY" ]]; then
            echo "::error::内网和外网 Registry 地址不能为空"
            exit 1
          fi
          validate_registry() {
            local name="$1"
            local value="$2"
            local host port

            if [[ "$value" == *"://"* || "$value" == *"/"* ]]; then
              echo "::error::$name 只能填写主机名或主机名:端口；即使是 HTTP 仓库也不要填写 http://"
              exit 1
            fi

            host="${value%%:*}"
            if [[ -z "$host" || "$value" == *:*:* ]]; then
              echo "::error::$name 格式无效，请填写主机名或主机名:端口"
              exit 1
            fi

            if [[ "$value" == *":"* ]]; then
              port="${value##*:}"
              if [[ ! "$port" =~ ^[0-9]+$ ]] || (( port < 1 || port > 65535 )); then
                echo "::error::$name 中的端口必须是 1-65535 之间的数字"
                exit 1
              fi
            fi
          }

          validate_registry "INTERNAL_REGISTRY" "$INTERNAL_REGISTRY"
          validate_registry "EXTERNAL_REGISTRY" "$EXTERNAL_REGISTRY"

      - name: Parse image name and version
        id: parse
        run: |
          set -euo pipefail

          IMAGE="${{ github.event.inputs.IMAGE_NAME }}"
          if [[ "$IMAGE" == *"@sha256:"* ]]; then
            DIGEST="${IMAGE##*@sha256:}"
            IMAGE_BASE="${IMAGE%%@sha256:*}"
            # 使用 digest 的前12位作为版本标签的一部分，避免过长
            VERSION="sha256-${DIGEST:0:12}"
          elif [[ "$IMAGE" == *":"* ]]; then
            VERSION="${IMAGE##*:}"
            IMAGE_BASE="${IMAGE%:*}"
          else
            VERSION="latest"
            IMAGE_BASE="$IMAGE"
          fi
          NEW_NAME="${IMAGE_BASE##*/}"
          if [[ "${{ github.event.inputs.USE_SUMMARY_REPOSITORY }}" == "true" ]]; then
            DEST_REPO="summary"
            SAFE_VERSION=$(echo "$VERSION" | sed 's/[^a-zA-Z0-9._-]/-/g')
            DEST_TAG="${NEW_NAME}-${SAFE_VERSION}"
          else
            DEST_REPO="$NEW_NAME"
            DEST_TAG="$VERSION"
          fi
          echo "image=$IMAGE_BASE" >> "$GITHUB_OUTPUT"
          echo "dest_repo=$(echo "$DEST_REPO" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          echo "dest_tag=$(echo "$DEST_TAG" | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure internal registry host
        env:
          INTERNAL_REGISTRY: ${{ github.event.inputs.INTERNAL_REGISTRY }}
          REGISTRY_HOST_IP: ${{ secrets.REGISTRY_HOST_IP }}
        run: |
          set -euo pipefail

          echo "::add-mask::$REGISTRY_HOST_IP"
          INTERNAL_REGISTRY_HOST="${INTERNAL_REGISTRY%%:*}"
          printf '%s %s\n' "$REGISTRY_HOST_IP" "$INTERNAL_REGISTRY_HOST" | sudo tee -a /etc/hosts > /dev/null
          if ! awk -v host="$INTERNAL_REGISTRY_HOST" '$2 == host { found = 1 } END { exit !found }' /etc/hosts; then
            echo "::error::内网 Registry hosts 映射写入失败"
            exit 1
          fi
          echo "已配置内网 Registry hosts 映射"

      - name: Install crane
        env:
          CRANE_VERSION: v0.22.1
        run: |
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME_IO }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN_IO }}
        run: echo "$DOCKERHUB_TOKEN" | crane auth login index.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Login to internal registry
        env:
          INTERNAL_REGISTRY: ${{ github.event.inputs.INTERNAL_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME_2 }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_2 }}
        run: echo "$DOCKER_PASSWORD" | crane auth login "$INTERNAL_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin

      - name: Copy image to internal registry
        env:
          SRC_IMAGE: ${{ github.event.inputs.IMAGE_NAME }}
          DEST_IMAGE: ${{ github.event.inputs.INTERNAL_REGISTRY }}/${{ github.event.inputs.TARGET_REPOSITORY }}/${{ steps.parse.outputs.dest_repo }}:${{ steps.parse.outputs.dest_tag }}
        run: |
          set -euo pipefail

          echo "同步：$SRC_IMAGE -> $DEST_IMAGE"
          crane copy "$SRC_IMAGE" "$DEST_IMAGE" --insecure
          echo "镜像已推送到内网 Registry"

      - name: Send DingTalk Success
        uses: zcong1993/actions-ding@master # 建议使用具体版本
        env:
          PUBLIC_IMAGE: ${{ github.event.inputs.EXTERNAL_REGISTRY }}/${{ github.event.inputs.TARGET_REPOSITORY }}/${{ steps.parse.outputs.dest_repo }}:${{ steps.parse.outputs.dest_tag }}
        with:
          dingToken: ${{ secrets.DING_TOKEN }}
          secret: ${{ secrets.DING_SECRET }} # 如果设置了加签,必须填这个
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "✅ 镜像同步成功",
                "text": "## ✅ 镜像同步成功\n- **镜像名称**: `${{ github.event.inputs.IMAGE_NAME }}`\n- **版本**: `${{ steps.parse.outputs.version }}`\n- **完整地址**: `${{ env.PUBLIC_IMAGE }}`\n\n**快速拉取：**\n```bash\ndocker pull ${{ env.PUBLIC_IMAGE }}\n```\n\n**快速重命名：**\n```bash\ndocker tag ${{ env.PUBLIC_IMAGE }} ${{ steps.parse.outputs.image }}:${{ steps.parse.outputs.version }}\n```\n\n**[查看运行日志](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**"
              }
            }
